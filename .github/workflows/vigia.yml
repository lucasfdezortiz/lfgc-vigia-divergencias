name: Vigia divergencias
on:
  schedule:
    - cron: '*/15 6-21 * * 1-5'   # cada 15 min, lunes a viernes, 06:00-21:45 UTC
  workflow_dispatch:
concurrency: vigia
jobs:
  vigia:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q numpy pandas
      - uses: actions/cache/restore@v4
        with:
          path: estado
          key: estado-${{ github.run_id }}
          restore-keys: estado-
      - run: python vigia_divergencias.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
          VIGIA_ESTADO: estado/vigia.json
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: estado
          key: estado-${{ github.run_id }}
