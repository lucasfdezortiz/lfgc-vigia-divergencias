name: Vigia divergencias
# Cada ejecucion revisa el mercado cada minuto durante 20 min; se lanza cada 15 min y la siguiente
# espera en cola a que acabe la anterior, asi siempre hay una vigilando (repositorio publico: minutos gratis).
on:
  schedule:
    - cron: '*/15 * * * 1-5'      # lunes a viernes, todo el dia (UTC)
    - cron: '*/15 21-23 * * 0'    # domingo noche: apertura de divisas y oro
  workflow_dispatch:
    inputs:
      informe:
        description: 'Enviar el informe del dia ahora'
        type: boolean
        default: false
concurrency:
  group: vigia
  cancel-in-progress: false
jobs:
  vigia:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q numpy pandas
      - uses: actions/cache/restore@v4
        with:
          path: estado
          key: estado-${{ github.run_id }}
          restore-keys: estado-
      - run: python vigia_divergencias.py ${{ inputs.informe && '--informe' || '--bucle 20' }}
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
          VIGIA_ESTADO: estado/vigia.json
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: estado
          key: estado-${{ github.run_id }}
